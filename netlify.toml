# Blind Royale: sitio estático, sin paso de build. Netlify publica la carpeta app/ tal cual.
[build]
  publish = "app"
  command = ""

# Sin caché en lo que decide la versión: así cada deploy llega en la siguiente visita.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/privacidad.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Fuentes e íconos no cambian de contenido: caché larga.
# Si alguna vez se reemplaza uno, dale un nombre nuevo (las fuentes ya llevan hash en el nombre).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
